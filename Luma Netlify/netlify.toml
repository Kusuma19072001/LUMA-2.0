[build]
  command  = "npm run build"
  publish  = "dist"

# proxy all API calls to your Flask service on Render
[[redirects]]
  from = "/api/*"
  to   = "https://<your-flask-on-render>.onrender.com/:splat"
  status = 200

# SPA fallback (remove if not using client-side routing)
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
